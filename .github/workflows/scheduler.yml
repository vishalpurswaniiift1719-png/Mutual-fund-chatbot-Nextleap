name: Scheduled Data Ingestion

on:
  schedule:
    - cron: '30 4 * * *'  # Runs daily at 10:00 AM IST (4:30 AM UTC)
  workflow_dispatch:      # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  ingest_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Ingestion Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMBEDDING_MODEL: models/gemini-embedding-2
          EMBEDDING_DIMENSIONS: 384
        run: |
          python -m ingestion.pipeline

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update mutual fund data and vector store"
          branch: master
          file_pattern: "data/ vectorstore/"
